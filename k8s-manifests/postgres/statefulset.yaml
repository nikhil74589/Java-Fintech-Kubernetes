apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgress
  namespace: banking

spec:
  serviceName: postgress-service
  replica: 1
  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres 

    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-node-2
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            -secretRef:
              name: postgres-secretRef
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgres/data
          redinessProbe:
            exec:
              command: ["pg_isready","-U","banking_user","-d","bankingdb"]
            initialDelaySeconds: 10
            periodSeconds: 5

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-Path
        resources:
          requests:
            storage: 5Gi                                   